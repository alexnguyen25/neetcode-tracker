<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The NeetCode Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F1; --paper2:#F1EBDD; --card:#FFFDF8; --ink:#201D17; --ink2:#5A5346; --ink3:#938B7D;
  --rule:#EAE3D4; --rule2:#D8CEBA; --accent:#B0461E; --accent2:#F3E4D8; --accent-ink:#7C3013;
  --olive:#5E7036; --ochre:#9A6B12; --brick:#A23A1B; --overdue:#9C2A1C;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent-ink);text-decoration:none}
button{font-family:var(--mono);cursor:pointer;color:var(--ink);background:none;border:none}
input,select,textarea{font-family:var(--mono);color:var(--ink)}

.topbar{height:4px;background:var(--accent);width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px 96px}

/* masthead */
.masthead{padding:32px 0 0;animation:fadeup .6s ease both}
.dateline{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.dateline .sync{display:inline-flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.ok{background:var(--olive)} .dot.busy{background:var(--ochre)} .dot.err{background:var(--overdue)}
.title{font-family:var(--serif);font-weight:600;font-size:56px;line-height:1;letter-spacing:-.015em;
  margin:12px 0 6px;display:flex;align-items:baseline;gap:15px}
.title .em{font-style:italic;font-weight:500;color:var(--accent)}
.subhead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);
  display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;gap:16px}
.rule-double{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:4px}

/* nav */
nav{display:flex;gap:0;border-bottom:1px solid var(--rule2);margin-bottom:38px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:15px 24px 13px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,background .15s;
  display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.tab .n{color:var(--ink3);font-size:10px}
.tab:hover{background:var(--paper2);color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.active .n{color:var(--accent)}

.view{animation:fadeup .45s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:48px 0 20px;gap:16px;flex-wrap:wrap}
.sec:first-child{margin-top:0}
.sec h2{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);font-weight:600;
  display:flex;align-items:baseline;gap:11px}
.sec h2 .g{color:var(--accent)}
.sec .meta{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kbd-hint{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kbd{border:1px solid var(--rule2);border-radius:3px;padding:1px 5px;color:var(--ink2);background:var(--paper)}

/* stat readouts */
.readouts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule2);background:var(--card)}
.readout{padding:24px 26px;border-right:1px solid var(--rule)}
.readout:last-child{border-right:none}
.readout .lab{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.readout .val{font-family:var(--serif);font-size:44px;line-height:1;font-weight:500;letter-spacing:-.01em}
.readout .val.rust{color:var(--accent)}
.readout .val .u{font-size:20px;color:var(--ink2)}
.readout .sub{font-size:11px;color:var(--ink2);margin-top:8px}

.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:56px;margin-top:8px}

/* ledger rows */
.ledger{border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  padding:20px 6px;border-bottom:1px solid var(--rule);transition:background .12s}
.row:hover{background:var(--paper2)}
.row.overdue{box-shadow:inset 3px 0 0 var(--overdue)}
.rnum{font-size:10px;letter-spacing:.06em;color:var(--ink2);border:1px solid var(--rule2);
  border-radius:3px;padding:4px 7px;min-width:32px;text-align:center;background:var(--paper)}
.rname{display:flex;flex-direction:column;gap:5px;min-width:0}
.rname .nm{font-size:15.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.cat{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);
  border-bottom:1px dotted var(--rule2);padding-bottom:1px}
.diff{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.diff.Easy{color:var(--olive)} .diff.Medium{color:var(--ochre)} .diff.Hard{color:var(--brick)}
.star{color:var(--accent);font-size:11px}
.note-dot{color:var(--accent);font-size:13px;line-height:1}
.badge{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule2);
  border-radius:3px;padding:2px 6px;color:var(--ink3)}
.rright{display:flex;align-items:center;gap:18px;justify-content:flex-end}
.due{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:right;min-width:66px}
.due.over{color:var(--overdue);font-weight:500}
.due.today{color:var(--accent);font-weight:500}
.rate{display:flex;gap:8px}
.rbtn{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--rule2);
  border-radius:3px;background:var(--card);transition:all .13s;color:var(--ink2)}
.rbtn:hover{border-color:var(--ink2);color:var(--ink)}
.rbtn.easy:hover{background:var(--olive);border-color:var(--olive);color:#fff}
.rbtn.ok:hover{background:var(--ochre);border-color:var(--ochre);color:#fff}
.rbtn.hard:hover{background:var(--brick);border-color:var(--brick);color:#fff}
.empty{padding:40px 6px;color:var(--ink3);font-size:14px;border-bottom:1px solid var(--rule);
  font-style:italic;font-family:var(--serif)}

/* weak list */
.mini{border-top:1px solid var(--ink)}
.mini .m{padding:16px 6px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s}
.mini .m:hover{background:var(--paper2)}
.mini .m .nm{font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:5px}
.dots{letter-spacing:2px;color:var(--accent);font-size:11px}
.dots .o{color:var(--rule2)}

/* progress bars */
.bars{border-top:1px solid var(--ink)}
.bar-row{display:grid;grid-template-columns:170px 1fr 58px;gap:18px;align-items:center;
  padding:13px 6px;border-bottom:1px solid var(--rule)}
.bar-row .bl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:7px;background:var(--paper2);border:1px solid var(--rule);position:relative;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .5s ease}
.bc{font-size:11px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}

/* pace tracker */
.pace{display:grid;grid-template-columns:0.8fr 1.4fr;gap:0;border:1px solid var(--rule2);background:var(--card)}
.pace-main{padding:26px 28px;border-right:1px solid var(--rule)}
.pace-proj{padding:26px 28px;display:flex;flex-direction:column;gap:10px}
.pace .lab{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.pace-num{font-family:var(--serif);font-size:50px;line-height:1;font-weight:500;color:var(--accent);letter-spacing:-.01em}
.pace-num .u{font-size:22px;color:var(--ink2)}
.pace-main .sub{font-size:11px;color:var(--ink2);margin-top:9px}
.proj-line{font-family:var(--serif);font-size:21px;line-height:1.3;font-weight:500;color:var(--ink)}
.track-line{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.track-line.ahead{color:var(--olive)} .track-line.behind{color:var(--brick)}
.target-ctrl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:1px solid var(--rule)}
.target-ctrl .by{color:var(--ink3)} .target-ctrl .opt{color:var(--ink3);font-size:10px}
.target-ctrl select,.target-ctrl input{background:var(--paper);border:1px solid var(--rule2);border-radius:3px;
  padding:6px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.target-ctrl input[type=date]{text-transform:none}

/* filters */
.filters{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:24px;
  padding:18px 20px;border:1px solid var(--rule2);background:var(--card)}
.filters input[type=text]{flex:1;min-width:170px;background:var(--paper);border:1px solid var(--rule2);
  border-radius:3px;padding:9px 12px;font-size:13px}
.filters input[type=text]:focus{outline:none;border-color:var(--accent)}
.filters select{background:var(--paper);border:1px solid var(--rule2);border-radius:3px;padding:9px 11px;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase}
.chip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border:1px solid var(--rule2);
  border-radius:3px;background:var(--paper);color:var(--ink2);transition:all .13s}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on.rust{background:var(--accent);border-color:var(--accent);color:#fff}

/* table */
.tbl{width:100%;border-collapse:collapse;border-top:1px solid var(--ink)}
.tbl th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500;
  text-align:left;padding:11px 12px;border-bottom:1px solid var(--rule2)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.c,.tbl td.c{text-align:center}
.tbl td{padding:15px 12px;border-bottom:1px solid var(--rule);font-size:13.5px;vertical-align:middle}
.tbl tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--paper2)}
.tbl td .pname{font-weight:500;color:var(--ink)}
.tbl tr.todo td .pname{color:var(--ink2)}
.tbl tr.retired td .pname{color:var(--ink3)}
.box{width:17px;height:17px;border:1px solid var(--rule2);border-radius:3px;display:inline-flex;
  align-items:center;justify-content:center;background:var(--paper);transition:all .13s}
.box:hover{border-color:var(--accent)}
.box.done{background:var(--olive);border-color:var(--olive);color:#fff;font-size:11px}
.num{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12px}
.nrev{font-size:11px;letter-spacing:.04em}
.nrev.over{color:var(--overdue);font-weight:500}
.nrev.today{color:var(--accent);font-weight:500}
.nrev.none{color:var(--ink3)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:16px}
.calnav button{font-size:15px;border:1px solid var(--rule2);border-radius:3px;width:32px;height:32px;
  background:var(--card);transition:all .13s}
.calnav button:hover{border-color:var(--ink2);background:var(--paper2)}
.calmo{font-family:var(--serif);font-size:26px;font-weight:500}
.callegend{display:flex;gap:18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.callegend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:9px;height:9px;border-radius:2px;display:inline-block}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule2);border-bottom:none}
.wd{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);text-align:center;
  padding:9px 0;border-right:1px solid var(--rule);background:var(--paper2)}
.wd:last-child{border-right:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--rule2);border-top:1px solid var(--rule2)}
.cell{min-height:104px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 8px;background:var(--card)}
.cell:nth-child(7n){border-right:1px solid var(--rule2)}
.cell.out{background:var(--paper2)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .d{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:5px}
.cell.today .d{color:var(--accent);font-weight:600}
.evt{font-size:10px;padding:3px 6px;border-radius:3px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;background:var(--paper2);color:var(--ink2);border-left:2px solid var(--ink3)}
.evt.over{background:#F7E3DF;color:var(--overdue);border-left-color:var(--overdue)}
.evt.done{background:#EAEEDD;color:var(--olive);border-left-color:var(--olive)}
.evt.more{background:none;border:none;color:var(--ink3);padding-left:6px}

/* heatmap (contribution graph) */
.heat-wrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:7px 9px;width:max-content}
.heat-months{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(12,16px);gap:4px;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.heat-months .hm{white-space:nowrap;overflow:visible}
.heat-wdays{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,16px);gap:4px;
  font-size:9px;color:var(--ink3);align-items:center;text-align:right}
.heat-grid{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(12,16px);
  grid-template-rows:repeat(7,16px);grid-auto-flow:column;gap:4px}
.hc{width:16px;height:16px;border-radius:3px;background:var(--paper2)}
.hc.empty{background:transparent}
.heatlegend{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);margin-top:14px}
.heatlegend .hc{width:12px;height:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(32,29,23,.44);display:none;align-items:flex-start;
  justify-content:center;padding:48px 20px;z-index:50;overflow-y:auto}
.scrim.open{display:flex;animation:fadein .2s ease both}
.modal{background:var(--card);border:1px solid var(--rule2);max-width:560px;width:100%;
  box-shadow:0 24px 64px rgba(32,29,23,.2);animation:fadeup .3s ease both;position:relative}
.modal .mtop{background:var(--accent);height:4px}
.modal .mbody{padding:30px 32px 30px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.mhead h3{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.08;letter-spacing:-.01em}
.mclose{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--rule2);
  border-radius:3px;padding:6px 10px;white-space:nowrap}
.mclose:hover{border-color:var(--ink2);color:var(--ink)}
.mmeta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink2);padding:14px 0 18px;border-bottom:1px solid var(--rule)}
.mblock{padding:20px 0;border-bottom:1px solid var(--rule)}
.mblock.last{border-bottom:none;display:flex;gap:12px;flex-wrap:wrap;padding-bottom:0}
.mblock .ml{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.comfort{display:flex;gap:9px}
.cf{width:36px;height:36px;border:1px solid var(--rule2);border-radius:3px;background:var(--paper);
  font-size:13px;font-variant-numeric:tabular-nums;transition:all .12s}
.cf:hover{border-color:var(--accent)}
.cf.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 19px;border:1px solid var(--ink);
  border-radius:3px;background:var(--ink);color:var(--paper);transition:all .13s;font-weight:500}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--rule2)}
.btn.ghost:hover{background:var(--paper2);color:var(--ink);border-color:var(--ink2)}
.btn.sm{padding:8px 13px}
.btn.danger{color:var(--brick);border-color:#E0BBB0}
.btn.danger:hover{background:var(--brick);border-color:var(--brick);color:#fff}
.mlink{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule2);border-radius:3px;
  padding:8px 13px;color:var(--accent-ink);display:inline-flex;gap:7px;align-items:center}
.mlink:hover{border-color:var(--accent);background:var(--accent2)}
.hint{font-size:11px;color:var(--ink3);font-family:var(--serif);font-style:italic}
.ctrl-row{display:flex;gap:10px;flex-wrap:wrap}
.field-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
textarea.note{width:100%;min-height:96px;background:var(--paper);border:1px solid var(--rule2);border-radius:3px;
  padding:12px 14px;font-size:13px;line-height:1.6;resize:vertical;color:var(--ink)}
textarea.note:focus,.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent)}
.modal input[type=date],.modal input[type=text],.modal input[type=number],.modal select{
  background:var(--paper);border:1px solid var(--rule2);border-radius:3px;padding:9px 11px;font-size:13px}
.rhist{display:flex;flex-direction:column}
.rh{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:9px 0;
  border-bottom:1px dotted var(--rule);font-size:12px}
.rh:last-child{border-bottom:none}
.rh .st{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.rh .st.due{color:var(--ink3)} .rh .st.over{color:var(--overdue)} .rh .st.done{color:var(--olive)}
.rh .st.skip{color:var(--ink3)} .rh .st.retired{color:var(--ochre)}

/* add-problem form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.form-grid .full{grid-column:1 / -1}
.fl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;display:block}
.form-grid input,.form-grid select{width:100%}
.seg{display:flex;gap:0;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;width:max-content}
.seg button{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 15px;border-right:1px solid var(--rule2);color:var(--ink2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--paper)}
.checkrow{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.checkrow input{width:16px;height:16px;accent-color:var(--accent)}

/* fab */
#fab{position:fixed;bottom:28px;right:28px;z-index:40;background:var(--accent);color:#fff;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:14px 20px;
  border-radius:3px;box-shadow:0 10px 28px rgba(176,70,30,.35);transition:transform .14s,box-shadow .14s;display:none}
#fab:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(176,70,30,.42)}

/* footer */
.colophon{margin-top:64px;padding-top:22px;border-top:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:14px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.colophon a{color:var(--ink2);border-bottom:1px dotted var(--rule2)}
.colophon a:hover{color:var(--accent)}
.colophon .links{display:flex;gap:22px}

/* banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--accent2);border:1px solid #E4C3B0;border-radius:3px;padding:13px 18px;margin-bottom:28px;
  font-size:12px;color:var(--accent-ink)}
.banner b{font-weight:600}
.banner button{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--accent);
  color:var(--accent-ink);border-radius:3px;padding:7px 12px;white-space:nowrap}
.banner button:hover{background:var(--accent);color:#fff}

@media(max-width:820px){
  .cols{grid-template-columns:1fr;gap:44px}
  .pace{grid-template-columns:1fr}
  .pace-main{border-right:none;border-bottom:1px solid var(--rule)}
}
@media(max-width:680px){
  .wrap{padding:0 18px 72px}
  .title{font-size:38px}
  .readouts{grid-template-columns:repeat(2,1fr)}
  .readout:nth-child(2){border-right:none}
  .readout:nth-child(1),.readout:nth-child(2){border-bottom:1px solid var(--rule)}
  .readout{padding:18px 18px}.readout .val{font-size:36px}
  .bar-row{grid-template-columns:108px 1fr 48px;gap:12px}
  .tblwrap{overflow-x:auto}
  .tbl{min-width:560px}
  .tbl .col-cat,.tbl .col-lc{display:none}
  .cell{min-height:72px}
  .rright{flex-direction:column;align-items:flex-end;gap:10px}
  .form-grid{grid-template-columns:1fr}
}
.loop{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.conf{margin-left:5px;font-weight:600;opacity:.6;cursor:help}
.badge.warn{cursor:help}
a.unsure{opacity:.45}
.caveats{font-size:13px;line-height:1.65;max-width:76ch}
.caveats p{margin:0 0 12px}
</style>
</head>

let filters = { q:"", cat:"all", diff:"all", blind:false, unsolved:false, calShowDone:false, rbxQ:"", rbxDiff:"all", rbxUnsolved:false, rbxOnsite:false, rbxSignal:false };
let saveTimer = null;
let reviewSeq = 1;

const intervals = () => state.settings.intervals;
const rbxIntervals = () => state.settings.rbxIntervals || RBX_INTERVALS;
const ladderFor = p => (p && isRbx(p.id)) ? rbxIntervals() : intervals();
// Review numbers past the end of a problem's own ladder fall back to the
// global ladder at that index. Without this, the nine already-solved overlaps
// -- which carry six reviews on the old 6-step ladder -- would have R5 and R6
// silently compressed from +30/+60 to +7.
function offsetFor(p, num){
  const L = ladderFor(p);
  if(L[num-1] != null) return L[num-1];
  const G = intervals();
  return G[num-1] != null ? G[num-1] : L[L.length-1];
}

/* ====================== DATE HELPERS ====================== */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
function addDaysISO(s, n){ const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function dayDiff(a, b){ return Math.round((new Date(a+"T00:00:00") - new Date(b+"T00:00:00"))/86400000); }
function fmtShort(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function fmtLong(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }

/* ====================== SYNC LAYER ====================== */
function setSync(kind, text){
  const dot = document.querySelector("#sync .dot");
  dot.className = "dot" + (kind==="ok"?" ok":kind==="busy"?" busy":kind==="err"?" err":"");
  document.getElementById("sync-t").textContent = text;
}
async function apiLoad(){
  const res = await fetch(scriptUrl + "?action=load", { method:"GET" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  return await res.json();
}
async function apiSave(){
  const res = await fetch(scriptUrl, {
    method:"POST",
    body: JSON.stringify({ action:"save", problems: state.problems, reviews: state.reviews, settings: state.settings })
  });
  if(!res.ok) throw new Error("HTTP "+res.status);
  return await res.json();
}
function scheduleSave(){
  if(mode!=="synced") return;
  setSync("busy","Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try { await apiSave(); setSync("ok","Synced"); }
    catch(e){ setSync("err","Sync error"); }
  }, 700);
}

/* ====================== SPACED REPETITION ====================== */
function genReviews(p){
  ladderFor(p).forEach((days, i)=>{
    state.reviews.push({ id: reviewSeq++, problemId: p.id, num: i+1,
      due: addDaysISO(p.dateSolved, days), status:"due", result:null, doneOn:null });
  });
}
function solveProblem(id, comfort){
  const p = probById(id); if(!p) return;
  const wasTodo = p.status!=="Solved";
  p.status = "Solved";
  p.comfort = comfort || p.comfort || 3;
  if(wasTodo || !p.dateSolved) p.dateSolved = todayISO();
  if(wasTodo) genReviews(p);
  scheduleSave();
}
function unsolveProblem(id){
  const p = probById(id); if(!p) return;
  p.status="Todo"; p.dateSolved=null; p.comfort=0; p.retired=false;
  state.reviews = state.reviews.filter(r=>r.problemId!==id);
  scheduleSave();
}
function setComfort(id, c){
  const p = probById(id); if(!p) return;
  p.comfort=c;
  if(p.status==="Solved") scheduleSave();
  if(openId===id) renderModal(id);
}
function rateReview(rid, result){
  const r = state.reviews.find(x=>x.id===rid); if(!r) return;
  r.status="done"; r.result=result; r.doneOn=todayISO();
  scheduleSave(); refresh();
  if(openId) renderModal(openId);
}
function skipReview(rid){ rateReview(rid, "skip"); }
function snoozeReview(rid, days){
  const r = state.reviews.find(x=>x.id===rid); if(!r) return;
  r.due = addDaysISO(r.due, days);
  scheduleSave(); refresh(); if(openId) renderModal(openId);
}
function retireProblem(id){
  const p = probById(id); if(!p) return;
  state.reviews.filter(r=>r.problemId===id && r.status==="due")
    .forEach(r=>{ r.status="done"; r.result="retired"; r.doneOn=todayISO(); });
  p.retired = true;
  scheduleSave(); refresh(); if(openId) renderModal(openId);
}
function reactivateProblem(id){
  const p = probById(id); if(!p) return;
  p.retired = false;
  state.reviews.filter(r=>r.problemId===id && r.result==="retired").forEach(r=>{
    r.status="due"; r.result=null; r.doneOn=null;
    r.due = addDaysISO(todayISO(), offsetFor(p, r.num));
  });
  scheduleSave(); refresh(); if(openId) renderModal(openId);
}
// Recomputes the due date of every pending review for p from its (possibly
// just-changed) dateSolved, using p's own ladder with the offsetFor fallback.
// Extracted from applySolveDate so it can be exercised without a DOM.
function recomputeReviewDueDates(p){
  state.reviews.filter(r=>r.problemId===p.id && r.status==="due").forEach(r=>{
    r.due = addDaysISO(p.dateSolved, offsetFor(p, r.num));
  });
}
function applySolveDate(id){
  const inp = document.getElementById("solve-date");
  if(!inp || !inp.value) return;
  const p = probById(id); if(!p) return;
  p.dateSolved = inp.value;
  recomputeReviewDueDates(p);
  scheduleSave(); renderModal(id); refresh();
}
function saveNote(id, txt){
  const p = probById(id); if(!p) return;
  if(p.notes === txt) return;
  p.notes = txt; scheduleSave();
}

/* ====================== CUSTOM PROBLEMS ====================== */
function allCats(){
  const extra = [];
  state.problems.forEach(p=>{ if(!CAT_ORDER.includes(p.cat) && !extra.includes(p.cat)) extra.push(p.cat); });
  return CAT_ORDER.concat(extra);
}
// Computes the next available custom problem id in the 1001-1999 band.
// Returns the id, or null if the band is full.
function nextCustomId(){
  const cids = state.problems.filter(p=>p.id>=1001 && p.id<2000).map(p=>p.id);
  const candidate = (cids.length ? Math.max(...cids) : 1000) + 1;
  if(candidate <= 1999) return candidate; // Normal case: band not exhausted
  // Band exhausted at top; scan for lowest gap in 1001-1999
  const used = new Set(cids);
  for(let id = 1001; id <= 1999; id++){
    if(!used.has(id)) return id;
  }
  return null; // Band genuinely full
}
function addCustomProblem(d){
  const id = nextCustomId();
  if(id === null){ alert("Custom problem band (1001-1999) is full. Delete a problem to add more."); return; }
  const p = { id, name:d.name, cat:d.cat||"Other", diff:d.diff||"Medium",
    blind:!!d.blind, num:d.num||0, url:d.url||"", status:"Todo", comfort:0, dateSolved:null, notes:"", retired:false };
  state.problems.push(p);
  scheduleSave(); refresh();
}
function removeProblem(id){
  state.problems = state.problems.filter(p=>p.id!==id);
  state.reviews = state.reviews.filter(r=>r.problemId!==id);
  scheduleSave();
}

  else state.settings.goal.target = Number(v);

/* ====================== DERIVED ====================== */
const probById = id => state.problems.find(p=>p.id===id);
function dueQueue(){
  const t = todayISO();
  return state.reviews.filter(r=>r.status==="due" && dayDiff(r.due, t) <= 0)
    .sort((a,b)=> a.due<b.due?-1:a.due>b.due?1:a.num-b.num);
}
function overdueCount(){ const t=todayISO(); return state.reviews.filter(r=>r.status==="due" && dayDiff(r.due,t)<0).length; }
function solvedLast(n){ const t=todayISO(); return state.problems.filter(p=>p.dateSolved && dayDiff(t,p.dateSolved)>=0 && dayDiff(t,p.dateSolved)<n).length; }
function solvedThisWeek(){ return solvedLast(7); }
function streak(){
  const done = new Set(state.reviews.filter(r=>r.doneOn).map(r=>r.doneOn));
  if(done.size===0) return 0;
  let cur = todayISO(), count=0;
  if(!done.has(cur)) cur = addDaysISO(cur,-1);
  while(done.has(cur)){ count++; cur = addDaysISO(cur,-1); }
  return count;
}
const solvedCount = () => state.problems.filter(p=>p.status==="Solved").length;
function paceStats(){
  const last14 = solvedLast(14);
  const target = state.settings.goal.target;
  const progress = solvedCount();
  const remaining = Math.max(0, target - progress);
  if(progress >= target) return { perWeek: last14? Math.round(last14/14*7*10)/10 : null, projText:`Target reached — ${progress} solved.`, trackText:null };
  if(last14 === 0) return { perWeek:null, projText:"Solve a few problems to project a finish date.", trackText:null };
  const perDay = last14/14;
  const perWeek = Math.round(perDay*7*10)/10;
  const days = Math.ceil(remaining/perDay);
  const finish = addDaysISO(todayISO(), days);
  const projText = `${remaining} to go — ${target} done by ${fmtLong(finish)}`;
  let trackText=null, trackClass="";
  if(state.settings.goal.date){
    const diff = dayDiff(state.settings.goal.date, finish);
    const wks = Math.round(Math.abs(diff)/7);
    if(diff >= 0){ trackText = wks<=0 ? "on track for your target date" : `about ${wks} week${wks!==1?"s":""} ahead of target`; trackClass="ahead"; }
    else { trackText = `about ${wks} week${wks!==1?"s":""} behind target`; trackClass="behind"; }
  }
  return { perWeek, projText, trackText, trackClass };
}

/* ====================== RENDER: shared ====================== */
function diffTag(d){ return `<span class="diff ${d}">${d}</span>`; }
function catTag(c){ return `<span class="cat">${c}</span>`; }
function hasNotes(p){ return p.notes && p.notes.trim().length>0; }
function dueLabel(r){
  const t=todayISO(), diff=dayDiff(r.due,t);
  if(diff<0) return `<span class="due over">Overdue ${Math.abs(diff)}d</span>`;
  if(diff===0) return `<span class="due today">Due today</span>`;
  return `<span class="due">${fmtShort(r.due)}</span>`;
}
function nextReviewCell(p){
  if(p.retired) return `<span class="nrev none">retired</span>`;
  if(p.status!=="Solved") return `<span class="nrev none">—</span>`;
  const up = state.reviews.filter(r=>r.problemId===p.id && r.status==="due").sort((a,b)=>a.due<b.due?-1:1)[0];
  if(!up) return `<span class="nrev none">complete</span>`;
  const t=todayISO(), diff=dayDiff(up.due,t);
  if(diff<0) return `<span class="nrev over">overdue</span>`;
  if(diff===0) return `<span class="nrev today">today</span>`;
  return `<span class="nrev">${fmtShort(up.due)}</span>`;
}
function comfortDots(c){
  let s=""; for(let i=1;i<=5;i++) s += i<=c ? "●" : `<span class="o">●</span>`;
  return `<span class="dots">${s}</span>`;
}

/* ====================== RENDER: Today ====================== */
function viewToday(){
  const q = dueQueue();
  const shown = q.slice(0, CONFIG.QUEUE_CAP);
  const backlog = q.length - shown.length;
  const weak = state.problems.filter(p=>p.status==="Solved" && !p.retired && p.comfort>0 && p.comfort<=2)
    .sort((a,b)=>a.comfort-b.comfort).slice(0,5);

  const rows = shown.length ? shown.map(r=>{
    const p = probById(r.problemId);
    const od = dayDiff(r.due, todayISO())<0;
    return `<div class="row ${od?"overdue":""}">
      <span class="rnum">R${r.num}</span>
      <div class="rname" onclick="openProblem(${p.id})" style="cursor:pointer">
        <span class="nm">${p.name}</span>
        <span class="tags">${catTag(p.cat)} ${diffTag(p.diff)} ${p.blind?'<span class="star">✦ Blind 75</span>':''} ${hasNotes(p)?'<span class="note-dot" title="has notes">✎</span>':''}</span>
      </div>
      <div class="rright">
        ${dueLabel(r)}
        <span class="rate">
          <button class="rbtn easy" onclick="rateReview(${r.id},'easy')">Easy</button>
          <button class="rbtn ok" onclick="rateReview(${r.id},'ok')">OK</button>
          <button class="rbtn hard" onclick="rateReview(${r.id},'hard')">Hard</button>
        </span>
      </div>
    </div>`;
  }).join("") : `<div class="empty">No reviews due. Solve a problem in the Index, or enjoy the clear desk.</div>`;

  const weakHtml = weak.length ? weak.map(p=>`
    <div class="m" onclick="openProblem(${p.id})">
      <div class="nm"><span>${p.name}</span> ${comfortDots(p.comfort)}</div>
      <span class="tags">${catTag(p.cat)} ${diffTag(p.diff)}</span>
    </div>`).join("") : `<div class="empty" style="border:none;padding:20px 6px">Nothing flagged weak yet.</div>`;

  return `
  <div class="readouts">
    <div class="readout"><div class="lab">Due today</div><div class="val rust">${q.length}</div><div class="sub">${overdueCount()} overdue</div></div>
    <div class="readout"><div class="lab">Solved this week</div><div class="val">${solvedThisWeek()}</div><div class="sub">past 7 days</div></div>
    <div class="readout"><div class="lab">Current streak</div><div class="val">${streak()}<span class="u"> d</span></div><div class="sub">days reviewing</div></div>
    <div class="readout"><div class="lab">Total solved</div><div class="val">${solvedCount()}</div><div class="sub">${Math.round(solvedCount()/Math.max(1,state.problems.length)*100)}% of ${state.problems.length}</div></div>
  </div>

  <div class="cols">
    <div>
      <div class="sec"><h2><span class="g">§</span> Review queue</h2>
        <span class="kbd-hint"><span class="kbd">E</span> <span class="kbd">O</span> <span class="kbd">H</span> rate the top item</span></div>
      <div class="ledger">${rows}</div>
      ${backlog>0?`<div style="font-size:11px;color:var(--ink3);padding:14px 6px;letter-spacing:.06em">+ ${backlog} more waiting — clear today's ${CONFIG.QUEUE_CAP} first, the rest roll forward.</div>`:""}
    </div>
    <div>
      <div class="sec"><h2><span class="g">§</span> Weakest</h2><span class="meta">comfort ≤ 2</span></div>
      <div class="mini">${weakHtml}</div>
    </div>

}

  if(filters.diff!=="all") list=list.filter(p=>p.diff===filters.diff);

  return `

  <div class="sec"><h2><span class="g">§</span> Problem index</h2><span class="meta">${list.length} of ${state.problems.length} · tap a row for detail · tap the box to solve</span></div>

    </tr></thead>

/* ====================== RENDER: Calendar ====================== */
function viewCalendar(){
  if(!calCursor){ const d=new Date(); calCursor={y:d.getFullYear(), m:d.getMonth()}; }
  const {y,m} = calCursor;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthName = first.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const t = todayISO();

  const byDay = {};
  state.reviews.forEach(r=>{
    if(!filters.calShowDone && r.status==="done") return;   // hide completed (incl. retired) by default
    const d=new Date(r.due+"T00:00:00");
    if(d.getFullYear()===y && d.getMonth()===m){ (byDay[d.getDate()] ||= []).push(r); }
  });

  let cells="";
  for(let i=0;i<startDow;i++) cells += `<div class="cell out"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${pad(m+1)}-${pad(day)}`;
    const evts = (byDay[day]||[]).sort((a,b)=>a.status==="done"?1:-1);
    let chips = evts.slice(0,3).map(r=>{
      const p=probById(r.problemId);
      const cls = r.status==="done" ? "done" : (dayDiff(r.due,t)<0 ? "over" : "");
      const nm = p.name.length>15 ? p.name.slice(0,14)+"…" : p.name;
      return `<div class="evt ${cls}" onclick="openProblem(${p.id})" style="cursor:pointer">${nm} R${r.num}</div>`;
    }).join("");
    if(evts.length>3) chips += `<div class="evt more">+${evts.length-3} more</div>`;
    cells += `<div class="cell ${dateStr===t?"today":""}"><div class="d">${day}</div>${chips}</div>`;
  }

  return `
  <div class="calhead">
    <div class="calnav">
      <button onclick="calMove(-1)" aria-label="Previous month">‹</button>
      <span class="calmo">${monthName}</span>
      <button onclick="calMove(1)" aria-label="Next month">›</button>
      <button onclick="calToday()" style="width:auto;padding:0 14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase">Today</button>
    </div>
    <div class="callegend">
      <span><span class="lg" style="background:#F7E3DF;border:1px solid var(--overdue)"></span>Overdue</span>
      <span><span class="lg" style="background:var(--paper2);border:1px solid var(--ink3)"></span>Due</span>
      ${filters.calShowDone?'<span><span class="lg" style="background:#EAEEDD;border:1px solid var(--olive)"></span>Done</span>':''}
      <button class="chip ${filters.calShowDone?'on':''}" onclick="toggleF('calShowDone')">Show completed</button>
    </div>
  </div>
  <div class="weekrow"><div class="wd">Sun</div><div class="wd">Mon</div><div class="wd">Tue</div><div class="wd">Wed</div><div class="wd">Thu</div><div class="wd">Fri</div><div class="wd">Sat</div></div>
  <div class="calgrid">${cells}</div>`;
}

/* ====================== heatmap ====================== */
function buildHeatmap(){
  const counts={};
  state.reviews.filter(r=>r.doneOn).forEach(r=>{counts[r.doneOn]=(counts[r.doneOn]||0)+1;});
  const ramp=["var(--paper2)","#E8C9B4","#D89A77","#C0683F","#9E3F18"];
  const lvl=n=> n===0?0:n===1?1:n===2?2:n<=4?3:4;
  const WEEKS=12;
  const t=new Date(todayISO()+"T00:00:00");
  const sun=new Date(t); sun.setDate(t.getDate()-t.getDay());
  const firstSun=new Date(sun); firstSun.setDate(sun.getDate()-(WEEKS-1)*7);

  let months=""; let prevMonth=-1;
  for(let c=0;c<WEEKS;c++){
    const wk=new Date(firstSun); wk.setDate(firstSun.getDate()+c*7);
    const mo=wk.getMonth(); let lbl="";
    if(mo!==prevMonth){ lbl=wk.toLocaleDateString("en-US",{month:"short"}); prevMonth=mo; }
    months+=`<div class="hm">${lbl}</div>`;
  }
  let cells="";
  for(let c=0;c<WEEKS;c++){
    for(let r=0;r<7;r++){
      const d=new Date(firstSun); d.setDate(firstSun.getDate()+c*7+r);
      const ds=iso(d);
      if(d>t){ cells+=`<div class="hc empty"></div>`; continue; }
      const n=counts[ds]||0;
      cells+=`<div class="hc" style="background:${ramp[lvl(n)]}" title="${fmtShort(ds)}: ${n} review${n!==1?"s":""}"></div>`;
    }
  }
  const wdays=["","Mon","","Wed","","Fri",""].map(x=>`<div>${x}</div>`).join("");
  return `
  <div class="heat-wrap">
    <div class="heat-months">${months}</div>
    <div class="heat-wdays">${wdays}</div>

/* ====================== RENDER: Roblox ====================== */
function rbxProblems(){ return state.problems.filter(p=>isRbx(p.id)); }
function rbxSolvedCount(){ return rbxProblems().filter(p=>p.status==="Solved").length; }
function daysToRbx(){ return Math.max(0, dayDiff(RBX_DATE, todayISO())); }

function confMark(c){
  if(!c) return "";
  const m = { analogue:["~","analogue only — read before trusting"],
              unverified:["‡","slug derived from title, unverified"],
              derived:["†","slug derived from title, verified by search"],
              verified:["†","slug derived from title, verified by search"],
              none:["—","no LeetCode equivalent"],
              flagged:["!","FastPrep flags this as not source-backed"] }[c];
  if(!m){
    if(c!=="exact") console.warn(`confMark: unrecognized conf value "${c}"`);
    return "";
  }
  return `<span class="conf" title="${m[1]}">${m[0]}</span>`;
}

function rbxRow(p){
  const m = ROBLOX_META[p.id];
  const links = [];
  if(p.url) links.push(`<a href="${p.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">LC</a>`);
  if(m.fp) links.push(`<a href="${m.fp}" target="_blank" rel="noopener" class="${m.fpVerified?"":"unsure"}" onclick="event.stopPropagation()">FP</a>`);
  if(m.fp2) links.push(`<a href="${m.fp2}" target="_blank" rel="noopener" class="${m.fpVerified?"":"unsure"}" onclick="event.stopPropagation()">FP2</a>`);
  return `
    <tr class="${p.retired?"retired":p.status==="Solved"?"":"todo"}" onclick="openProblem(${p.id})">
      <td class="c" onclick="event.stopPropagation();toggleSolve(${p.id})">
        <span class="box ${p.status==="Solved"?"done":""}">${p.status==="Solved"?"✓":""}</span></td>
      <td><span class="pname">${p.name}</span>${confMark(m.conf)}${m.warn?` <span class="badge warn" title="${m.warn}">⚠</span>`:""}${hasNotes(p)?' <span class="note-dot" title="has notes">✎</span>':''}</td>
      <td>${diffTag(p.diff)}</td>
      <td><span class="num">${m.sources}</span></td>
      <td class="c">${m.onsite?'<span class="badge">onsite</span>':''}</td>
      <td class="c">${links.join(" ") || '<span class="num">—</span>'}</td>
      <td class="c">${p.status==="Solved"?comfortDots(p.comfort||0):'<span class="num">—</span>'}</td>
      <td class="r">${nextReviewCell(p)}</td>
    </tr>`;
}

function viewRoblox(){
  let list = rbxProblems();
  if(filters.rbxQ){ const q=filters.rbxQ.toLowerCase(); list=list.filter(p=>p.name.toLowerCase().includes(q)); }
  if(filters.rbxDiff!=="all") list=list.filter(p=>p.diff===filters.rbxDiff);
  if(filters.rbxUnsolved) list=list.filter(p=>p.status!=="Solved");
  if(filters.rbxOnsite) list=list.filter(p=>ROBLOX_META[p.id].onsite);
  if(filters.rbxSignal) list=list.filter(p=>ROBLOX_META[p.id].sources.split("·").length>=3);

  const total = rbxProblems().length, done = rbxSolvedCount(), d = daysToRbx();
  const rawD = dayDiff(RBX_DATE, todayISO());
  const groups = RBX_GROUPS.map(g=>{
    const inG = list.filter(p=>ROBLOX_META[p.id].rcat===g);
    if(!inG.length) return "";
    const gTotal = rbxProblems().filter(p=>ROBLOX_META[p.id].rcat===g);
    const gDone = gTotal.filter(p=>p.status==="Solved").length;
    return `
    <div class="sec"><h2><span class="g">§</span> ${g}</h2>
      <span class="meta">${gDone} of ${gTotal.length} solved</span></div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th class="c">✓</th><th>Problem</th><th>Difficulty</th><th>Sources</th>
        <th class="c">Stage</th><th class="c">Links</th><th class="c">Comfort</th><th class="r">Next review</th></tr></thead>
      <tbody>${inG.map(rbxRow).join("")}</tbody>
    </table></div>`;
  }).join("");

  return `
  <div class="sec"><h2><span class="g">§</span> Roblox superday</h2>
    <span class="meta">${rawD<0?"interview passed":d===0?"today":`${d} day${d===1?"":"s"} out`} · ${fmtLong(RBX_DATE)} · ${done} of ${total} solved</span></div>
  <div class="loop">
    <span>Technical 2 — 5:45p</span><span>Technical 1 — 6:30p</span><span>Comm &amp; Collab — 7:15p</span>
  </div>
  <div class="filters">
    <input type="text" id="fr-q" placeholder="Search the 98…" value="${filters.rbxQ.replace(/"/g,'&quot;')}">
    <button class="chip ${filters.rbxDiff==='all'?'on':''}" onclick="setRbxDiff('all')">All</button>
    <button class="chip ${filters.rbxDiff==='Easy'?'on':''}" onclick="setRbxDiff('Easy')">Easy</button>
    <button class="chip ${filters.rbxDiff==='Medium'?'on':''}" onclick="setRbxDiff('Medium')">Medium</button>
    <button class="chip ${filters.rbxDiff==='Hard'?'on':''}" onclick="setRbxDiff('Hard')">Hard</button>
    <button class="chip ${filters.rbxUnsolved?'on':''}" onclick="toggleF('rbxUnsolved')">Unsolved</button>
    <button class="chip ${filters.rbxOnsite?'on rust':''}" onclick="toggleF('rbxOnsite')">Onsite only</button>
    <button class="chip ${filters.rbxSignal?'on':''}" onclick="toggleF('rbxSignal')" title="Backed by 3 or more distinct sources">3+ sources</button>
  </div>
  ${groups || '<div class="empty" style="text-align:center;padding:40px">No problems match these filters.</div>'}
  <div class="sec"><h2><span class="g">§</span> Read before you trust a link</h2></div>
  <div class="caveats">
    <p><b>FastPrep reliability.</b> FastPrep re-audited its legacy author-written Roblox reports and found no original report supporting <i>Phone Battery Discharge Scheduling</i> — a 0% match to verified source material. At least one entry is invented and mislabeled. Read the source note on any FastPrep problem before treating it as real Roblox signal.</p>
    <p><b>Link marks.</b> <span class="conf">~</span> analogue only, shares a pattern but differs in specifics — practice the pattern, don't expect the question. <span class="conf">‡</span> slug derived from the title, unverified. <span class="conf">†</span> derived and verified by search. <span class="conf">—</span> no LeetCode equivalent. <span class="conf">!</span> FastPrep flags it as not source-backed.</p>
    <p><b>Stage matters.</b> Most of the FastPrep source is OA and phone-screen data — stages already cleared. Only six entries are onsite-tagged; the “Onsite only” filter above isolates them.</p>
    <p><b>Constructed URLs.</b> 27 of the 42 FastPrep links were built from a slug pattern rather than verified. Five of fifteen verified slugs diverge from their displayed titles, so expect roughly a third of the constructed ones to 404. (You'll only find 40 FastPrep links below, not 42 — a few source entries are variants of the same problem, so they collapse to one link here.) Dimmed FP links are the unverified ones. If one 404s, search the title on FastPrep rather than editing the slug.</p>
    <p><b>Strongest signal.</b> Course Schedule II (all four sources) · Number of Ways to Wear Different Hats (E · G14 · L) · Maximize Distance to Closest Person (G18 · L · T) · Candy Crush (G15 · L · T) · Implement Trie (G7 · L · T) · Design Search Autocomplete System (G5 · L · T) · Design Hit Counter (E · G2 · L) · Number of Recent Calls (E · G2 · L). Highest single counts: Task Scheduler G22, Maximize Distance G18, Candy Crush G15, Hats G14.</p>
  </div>`;
}

/* ====================== MODAL: problem ====================== */
function openProblem(id){ openId=id; renderModal(id); document.getElementById("scrim").classList.add("open"); }
function closeModal(){ openId=null; document.getElementById("scrim").classList.remove("open"); document.getElementById("scrim").innerHTML=""; }
function renderModal(id){
  const p = probById(id); if(!p) return;
  const revs = state.reviews.filter(r=>r.problemId===id).sort((a,b)=>a.num-b.num);
  const t = todayISO();
  const dueRev = revs.filter(r=>r.status==="due").sort((a,b)=>a.due<b.due?-1:1)[0];
  const hasPending = revs.some(r=>r.status==="due");

  const histRows = revs.length ? revs.map(r=>{
    let cls="due", txt="Due "+fmtShort(r.due);
    if(r.status==="done"){
      cls = r.result==="retired" ? "retired" : r.result==="skip" ? "skip" : "done";
      txt = r.result==="retired" ? "Retired" : r.result==="skip" ? "Skipped" : ("Done"+(r.result?" · "+r.result:""));
    } else if(dayDiff(r.due,t)<0){ cls="over"; txt="Overdue "+fmtShort(r.due); }
    else if(dayDiff(r.due,t)===0){ cls="due"; txt="Due today"; }
    return `<div class="rh"><span class="rnum">R${r.num}</span><span class="num">${fmtShort(r.due)}</span><span class="st ${cls}">${txt}</span></div>`;
  }).join("") : `<div class="hint">No reviews scheduled — solve the problem to begin the cycle.</div>`;

  const cf = [1,2,3,4,5].map(n=>`<button class="cf ${p.comfort===n?"on":""}" onclick="setComfort(${id},${n})">${n}</button>`).join("");

  const statusBlock = p.status==="Solved" ? `
    <div class="mblock">
      <div class="ml">Solved on</div>
      <div class="field-row">
        <input type="date" id="solve-date" value="${p.dateSolved||""}">
        <button class="btn ghost sm" onclick="applySolveDate(${id})">Update schedule</button>
        <span class="hint">re-dates pending reviews from this day</span>
      </div>
    </div>
    <div class="mblock">
      <div class="ml">Comfort level</div>
      <div class="comfort">${cf}</div>
    </div>
    <div class="mblock">
      <div class="ml">Review controls</div>
      <div class="ctrl-row">
        ${dueRev?`<button class="btn ghost sm" onclick="skipReview(${dueRev.id})">Skip next</button>
                  <button class="btn ghost sm" onclick="snoozeReview(${dueRev.id},3)">Snooze 3 days</button>`:""}
        ${hasPending && !p.retired?`<button class="btn ghost sm" onclick="retireProblem(${id})">Retire — I know it cold</button>`:""}
        ${p.retired?`<button class="btn ghost sm" onclick="reactivateProblem(${id})">Reactivate</button>`:""}
        ${!dueRev && !hasPending && !p.retired?`<span class="hint">all reviews complete</span>`:""}
      </div>
    </div>` : `
    <div class="mblock">
      <div class="ml">Comfort level — set before solving</div>
      <div class="comfort">${cf}</div>
    </div>
    <div class="mblock">
      <div class="field-row">
        <button class="btn" onclick="solveProblem(${id}, ${p.comfort||3});closeModal();refresh()">Mark as solved</button>
        <span class="hint">schedules ${intervals().length} reviews at +${intervals().join(", +")} days</span>
      </div>
    </div>`;

  document.getElementById("scrim").innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="mtop"></div>
      <div class="mbody">
        <div class="mhead">
          <h3>${p.name}</h3>
          <button class="mclose" onclick="closeModal()">Close ✕</button>
        </div>
        <div class="mmeta">
          ${catTag(p.cat)} ${diffTag(p.diff)} ${p.blind?'<span class="star">✦ Blind 75</span>':''}
          ${isCustom(p.id)?'<span class="badge">custom</span>':''}
          ${p.num?`<span class="num">LeetCode #${p.num}</span>`:""}
          ${p.url?`<a class="mlink" href="${p.url}" target="_blank" rel="noopener">Open ↗</a>`:""}
        </div>
        ${statusBlock}
        <div class="mblock">
          <div class="ml">Notes</div>
          <textarea class="note" id="note-${id}" placeholder="approach, pattern, edge cases, link to your solution…"
            onblur="saveNote(${id}, this.value)">${(p.notes||"").replace(/</g,"&lt;")}</textarea>
        </div>
        <div class="mblock">
          <div class="ml">Review schedule</div>
          <div class="rhist">${histRows}</div>
        </div>
        <div class="mblock last">
          ${p.status==="Solved"?`<button class="btn ghost" onclick="if(confirm('Mark unsolved and delete all its reviews?')){unsolveProblem(${id});closeModal();refresh();}">Mark unsolved</button>`:""}
          ${isCustom(p.id)?`<button class="btn ghost danger" onclick="if(confirm('Delete this custom problem permanently?')){removeProblem(${id});closeModal();refresh();}">Delete problem</button>`:""}
        </div>
      </div>
    </div>`;
}

function resetIntervals(){ DEFAULT_INTERVALS.forEach((v,i)=>{ document.getElementById("iv-"+i).value=v; }); RBX_INTERVALS.forEach((v,i)=>{ document.getElementById("riv-"+i).value=v; }); }
function resetAllData(){
  const msg = mode==="synced"
    ? "Clear ALL progress — every solve, review, note, and custom problem — back to a blank 228, and overwrite your connected Sheet to match? This cannot be undone."
    : "Clear ALL progress back to a blank 228? This cannot be undone.";
  if(!confirm(msg)) return;
  initProblems(null);
  state.reviews = [];
  reviewSeq = 1;
  if(mode==="synced"){ setSync("busy","Saving…"); apiSave().then(()=>setSync("ok","Synced")).catch(()=>setSync("err","Sync error")); }
  closeModal();
  refresh();
}

/* ====================== DEMO SEED ====================== */
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedDemo(){
  const rnd = mulberry32(20260529);
  const pool = [2,3,3,4,4,5];
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const solveOn = (p, daysAgo, recent) => {
    p.status="Solved"; p.dateSolved = addDaysISO(todayISO(), -daysAgo); p.comfort = pick(pool);
    ladderFor(p).forEach((days,i)=>{
      const due = addDaysISO(p.dateSolved, days);
      const rev = { id: reviewSeq++, problemId:p.id, num:i+1, due, status:"due", result:null, doneOn:null };
      const diff = dayDiff(due, todayISO());
      const cutoff = recent ? -1 : 0;
      if(diff < cutoff){ rev.status="done"; rev.result = pick(["easy","ok","ok","hard"]); rev.doneOn = due; }
      state.reviews.push(rev);
    });
  };
  state.problems.forEach((p, idx)=>{
    const chance = idx < 50 ? 0.40 : idx < 105 ? 0.14 : 0.04;
    if(rnd() < chance) solveOn(p, 12 + Math.floor(rnd()*58), false);
  });
  let added = 0;
  for(let i=0; i<state.problems.length && added<9; i++){
    const p = state.problems[(i*9) % state.problems.length];
    if(p.status==="Solved") continue;
    solveOn(p, 1 + Math.floor(rnd()*8), true); added++;
  }
  // a couple of sample notes so the ✎ indicator is visible in the demo
  const noted = state.problems.filter(p=>p.status==="Solved").slice(0,2);
  if(noted[0]) noted[0].notes = "Two-pointer once sorted. Watch the duplicate-skip step.";
  if(noted[1]) noted[1].notes = "Monotonic stack — push index, pop while current is larger.";
  // fill recent days so the streak reads as consistent (demo polish only)
  const done = state.reviews.filter(r=>r.status==="done");
  for(let k=0; k<5; k++){
    const day = addDaysISO(todayISO(), -k);
    if(!done.some(r=>r.doneOn===day)){
      const cand = done.find(r=>r.doneOn && dayDiff(day, r.doneOn)>0 && dayDiff(day, r.doneOn)<=18 && !done.filter(x=>x.doneOn===day).length);
      if(cand) cand.doneOn = day;
    }
  }
}

/* ====================== INIT ====================== */
function initProblems(seed){
  const codeSeed = PROBLEMS_SEED.concat(ROBLOX_SEED);
  const seededIds = new Set(codeSeed.map(p=>p.id));
  const base = codeSeed.map(p=>{
    const s = seed && seed[p.id];
    return { ...p,
      status: s ? s.status : "Todo",
      comfort: s ? (s.comfort||0) : 0,
      dateSolved: s ? (s.dateSolved||null) : null,
      notes: s && s.notes ? s.notes : "",
      retired: !!(s && s.retired) };
  });
  const custom = [];
  // Only rows the code does not seed are user-added. Without the seededIds
  // guard, Roblox ids (2001+) satisfy `>= 1001` and get added a second time.
  if(seed) Object.values(seed).forEach(s=>{
    if(s.id >= 1001 && !seededIds.has(s.id)) custom.push({ ...s, notes:s.notes||"", retired:!!s.retired });
  });
  state.problems = base.concat(custom);
}
function showBanner(html){ document.getElementById("banner-slot").innerHTML = html; }

async function boot(){
  document.getElementById("today-date").textContent =
    new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});

  if(mode==="demo"){
    initProblems(null);
    seedDemo();
    setSync("","Demo mode");
    showBanner(`<div class="banner"><span><b>Demo mode.</b> Sample progress shown — changes won't be saved. Connect a Google Sheet to track for real across every device.</span>
      <button onclick="openConnect()">Connect Google Sheets</button></div>`);
  } else {
    setSync("busy","Loading…");
    // Wipe any demo data first so it can never bleed into a real sheet (display or save).
    state.reviews = [];
    reviewSeq = 1;
    state.settings = { intervals: DEFAULT_INTERVALS.slice(), rbxIntervals: RBX_INTERVALS.slice(), goal: { target: 150, date: null } };
    showBanner("");
    try {
      const data = await apiLoad();
      if(data && data.settings){
        if(data.settings.intervals && data.settings.intervals.length===6) state.settings.intervals = data.settings.intervals;
        if(Array.isArray(data.settings.rbxIntervals) && data.settings.rbxIntervals.length===4
           && data.settings.rbxIntervals.every(n=>Number.isFinite(n) && n>0))
          state.settings.rbxIntervals = data.settings.rbxIntervals;
        if(data.settings.goal) state.settings.goal = { target: data.settings.goal.target||150, date: data.settings.goal.date||null };
      }
      const hasProblems = !!(data && data.problems && data.problems.length);
      const byId = {};
      if(hasProblems) data.problems.forEach(p=>byId[p.id]=p);
      initProblems(hasProblems ? byId : null);
      state.reviews = (data && data.reviews) ? data.reviews.map(r=>({...r})) : [];
      reviewSeq = state.reviews.reduce((m,r)=>Math.max(m, r.id+1), 1);
      if(!hasProblems) await apiSave();   // fresh sheet: persist the clean starting state
      setSync("ok","Synced");
    } catch(e){
      initProblems(null);
      state.reviews = [];
      reviewSeq = 1;
      setSync("err","Sync error — working locally");
      showBanner(`<div class="banner"><span><b>Couldn't reach your Sheet.</b> Check the deployment URL and that access is set to “Anyone.” Working locally for now.</span>
        <button onclick="location.reload()">Retry</button></div>`);
    }
  }
  renderView(true);
}
